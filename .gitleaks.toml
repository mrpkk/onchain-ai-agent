# Gitleaks-конфиг KARTA: публичные тестовые фикстуры не являются секретами.
title = "KARTA gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Публичные фикстуры: anvil-ключи, адреса контрактов, тестовые файлы"
regexes = [
  # anvil default accounts (публично известны, только тесты/скрипты)
  '''0x59c6995e998f97a5a0044966f0945389dc9e86dae88c7a8412f4603b6b78690d''',
  '''0x5de4111afa1a4b94908f83103eb1f1706367c2e68ca870fc3fb9a804cdab365a''',
  '''0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80''',
  # публичные адреса тестнет-контрактов
  '''0x0eB3e17862A108Bbbc91989e6Ca1a3ed16f69710''',
  '''0x212774d426519437d5Eb1126fE382fC7b7cCe7B0''',
  '''0xEeeeeEeeeEeEeeEeEeEeeEEEeeeeEeeeeeeeEEeE''',
]
# Тестовые файлы и anvil-скрипты содержат только публичные фикстуры (ревьюятся отдельно).
paths = [
  '''backend/tests/''',
  '''smart-contracts/test/''',
  '''scripts/.*anvil.*\.py''',
]
