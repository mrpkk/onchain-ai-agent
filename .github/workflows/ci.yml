name: CI
on:
  push: { branches: [main, master, "feature/v2-modernization"] }
  pull_request: {}
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.14" }  # как dev-окружение: на 3.12 coverage теряет greenlet-контексты SQLAlchemy (артефакт измерения)
      - run: pip install -r backend/requirements.txt pytest
      - name: Backend tests + coverage gate (80%)
        run: |
          pip install -q pytest-cov
          python3 -m pytest backend/tests -q --cov=src --cov-fail-under=80
      - name: Static JS syntax (node --check)
        run: |
          node --check backend/src/api/static/dashboard.js
          node --check backend/src/api/static/i18n.js
      - name: SAST (bandit, medium+)
        run: |
          pip install -q bandit
          bandit -r backend/src --severity-level medium
      - name: Dependency audit (pip-audit)
        run: |
          pip install -q pip-audit
          pip-audit -r backend/requirements.txt --progress-spinner off
      - name: Secret scan (private keys)
        run: "! grep -rnE '0x[a-f0-9]{64}' backend/src --include='*.py'"
      - name: Gitleaks (secrets scan)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Install dependencies
        working-directory: smart-contracts
        run: npm ci
      - name: Contract tests
        working-directory: smart-contracts
        run: npx hardhat test
      - name: Slither (fail on high)
        uses: crytic/slither-action@v0.4.0
        with:
          target: smart-contracts/
          fail-on: high
      - name: Aderyn (soft check)
        continue-on-error: true
        uses: Cyfrin/aderyn-ci@v0
        with:
          fail-on: high
