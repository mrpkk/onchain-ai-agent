name: CI
on:
  push: { branches: [main, master] }
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pytest cryptography eth-account
      - name: Security tests (KeyVault, redaction, JWT-gate)
        run: python3 -m pytest backend/tests/test_security.py -q
      - name: Secret scan
        run: "! grep -rnE '0x[a-f0-9]{64}' backend/src --include='*.py'"
